<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1518" />
    <meta name="description" content="Turn a photo into a subtle 3D window that responds to phone tilt. Works offline." />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Depth Photo</title>
  </head>
  <body>
    <main id="app">
      <div id="stage">
        <canvas id="view" aria-label="Photo with depth effect"></canvas>
        <div id="hud" hidden></div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>

      <div id="toolbar">
        <button id="enable-motion" type="button" hidden>Enable motion</button>
        <button id="toggle-motion" type="button" aria-pressed="true">Motion on</button>
        <button id="reset" type="button">Reset view</button>
        <button id="toggle-settings" type="button" aria-expanded="false" aria-controls="settings">Settings</button>
      </div>

      <form id="settings" hidden>
        <fieldset>
          <legend>Effect</legend>
          <label for="s-strength">Strength <output id="o-strength"></output></label>
          <input id="s-strength" name="strength" type="range" min="0" max="1" step="0.05" />
          <label for="s-maxOffset">Max shift (% of short side) <output id="o-maxOffset"></output></label>
          <input id="s-maxOffset" name="maxOffset" type="range" min="0.005" max="0.06" step="0.0025" />
        </fieldset>
        <fieldset>
          <legend>Motion tuning (development)</legend>
          <label for="s-tiltRange">Tilt range (degrees) <output id="o-tiltRange"></output></label>
          <input id="s-tiltRange" name="tiltRange" type="range" min="3" max="30" step="1" />
          <label for="s-recenterSeconds">Re-centre time (s, 0 = off) <output id="o-recenterSeconds"></output></label>
          <input id="s-recenterSeconds" name="recenterSeconds" type="range" min="0" max="15" step="0.5" />
          <label for="s-minCutoff">Smoothing min cutoff (Hz) <output id="o-minCutoff"></output></label>
          <input id="s-minCutoff" name="minCutoff" type="range" min="0.1" max="5" step="0.1" />
          <label for="s-beta">Smoothing speed response <output id="o-beta"></output></label>
          <input id="s-beta" name="beta" type="range" min="0" max="3" step="0.05" />
          <label for="s-springOmega">Spring stiffness <output id="o-springOmega"></output></label>
          <input id="s-springOmega" name="springOmega" type="range" min="2" max="30" step="1" />
          <label class="check"><input id="s-invertX" name="invertX" type="checkbox" /> Invert horizontal</label>
          <label class="check"><input id="s-invertY" name="invertY" type="checkbox" /> Invert vertical</label>
          <label class="check"><input id="s-showHud" name="showHud" type="checkbox" /> Show debug readout</label>
        </fieldset>
        <button id="settings-defaults" type="button">Restore defaults</button>
      </form>

      <div id="update" hidden>
        <span>A new version is ready.</span>
        <button id="update-reload" type="button">Reload</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
